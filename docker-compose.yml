services:
  neo4j:
    image: neo4j:5.26-community
    ports:
      - "127.0.0.1:${RESEARCH_CANVAS_NEO4J_HTTP_PORT:-17474}:7474"
      - "127.0.0.1:${RESEARCH_CANVAS_NEO4J_BOLT_PORT:-17687}:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD}"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      # Local dev only: the default auth_max_failed_attempts (3) locks the
      # account under rapid test-suite connection bursts; raise it so the
      # full Rust integration suite doesn't spuriously hit "too many failed
      # attempts". Not a security setting for a throwaway local graph.
      NEO4J_dbms_security_auth__max__failed__attempts: "1000000"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          cypher-shell -a bolt://127.0.0.1:7687 -d neo4j -u neo4j
          -p "$${NEO4J_AUTH#*/}" "RETURN 1;" >/dev/null 2>&1
      interval: 2s
      timeout: 5s
      retries: 45
      start_period: 10s
    labels:
      org.research-canvas.role: local-neo4j
volumes:
  neo4j_data:
    name: "${RESEARCH_CANVAS_NEO4J_VOLUME:-antichristproject_neo4j_data}"
  neo4j_logs:
    name: "${RESEARCH_CANVAS_NEO4J_LOGS_VOLUME:-antichristproject_neo4j_logs}"
