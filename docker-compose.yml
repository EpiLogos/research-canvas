services:
  neo4j:
    image: neo4j:5.26-community
    container_name: antichrist-neo4j
    ports:
      - "7474:7474"   # browser UI
      - "7687:7687"   # bolt
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD}"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      # Local dev only: the default auth_max_failed_attempts (3) locks the
      # account under rapid test-suite connection bursts; raise it so the
      # full Rust integration suite doesn't spuriously hit "too many failed
      # attempts". Not a security setting for a throwaway local graph.
      NEO4J_dbms_security_auth__max__failed__attempts: "1000000"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
volumes:
  neo4j_data:
  neo4j_logs:
