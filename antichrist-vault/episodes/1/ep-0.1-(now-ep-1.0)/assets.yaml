target_per_category: 8
output_dir: episodes/ep-0.1/assets

# sources field controls which APIs to query per entry:
#   wikimedia — Wikimedia Commons (art, photos, diagrams, manuscripts)
#   met       — Met Open Access (fine art, sculpture, coins, manuscripts)
# figures and photos = wikimedia only (Met has no photography archive)
# artworks and symbols = both (Met excels at physical art objects)

symbols:
  sun_solar:
    label: "Sun — cosmic ontological image"
    sources: [wikimedia, met]
    queries:
      - "sol invictus solar deity Roman coin ancient"
      - "sun god Ra Egyptian hieroglyph scarab"
      - "sun mandala medieval illuminated manuscript gold"
      - "solar disk celestial alchemical engraving woodcut"
    limit: 10

  black_sun:
    label: "Black Sun — inverted solar principle"
    sources: [wikimedia, met]
    queries:
      - "eclipse solar darkness painting dramatic"
      - "Blind Orion Poussin night darkness mythology painting"
      - "dark night soul painting alchemical blackness"
      - "eclipse sun corona darkness ancient engraving"
    limit: 8

  prism_rainbow:
    label: "Prism — white light into spectrum"
    sources: [wikimedia, met]
    queries:
      - "Isaac Newton prism experiment illustration engraving"
      - "rainbow landscape painting Turner Joseph"
      - "spectrum light optics color illustration book"
    limit: 6

  lamb_agnus_dei:
