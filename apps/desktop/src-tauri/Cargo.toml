[package]
name = "research-canvas-desktop"
version = "0.1.0"
description = "Local-first research canvas desktop app"
authors = ["Codex"]
edition = "2021"
build = "build.rs"
default-run = "research-canvas-desktop"

[lib]
name = "research_canvas_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
neo4rs = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
dirs = "5"
portable-pty = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
