name: Redemption T12 final acceptance

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: redemption-t12-final-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install canonical Linux bridge build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Check T12 Rust formatting
        run: rustfmt --edition 2021 --check apps/desktop/src-tauri/src/commands/places.rs

      - name: Check and prebuild canonical browser bridge
        run: |
          cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --bin terminal_bridge
          cargo build --manifest-path apps/desktop/src-tauri/Cargo.toml --bin terminal_bridge

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Repair bounded expression fallback when needed
        id: repair
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          target = Path('packages/canvas/src/psychogeographic/PsychogeographicMap.tsx')
          text = target.read_text()
          old = '              return [node.graphNodeId, []] as const;'
          new = '              return [node.graphNodeId, [] as ArchetypalExpression[]] as const;'
          count = text.count(old)
          if count == 0:
              print('expression fallback already repaired')
          elif count == 1:
              target.write_text(text.replace(old, new, 1))
              print('repaired expression fallback')
          else:
              raise SystemExit(f'expected at most one expression fallback, found {count}')
          PY
          if git diff --quiet -- packages/canvas/src/psychogeographic/PsychogeographicMap.tsx; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git diff --check -- packages/canvas/src/psychogeographic/PsychogeographicMap.tsx
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Typecheck workspace
        run: pnpm exec tsc -b

      - name: Commit bounded expression fallback repair
        if: steps.repair.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "research-canvas-redemption-bot"
          git config user.email "actions@users.noreply.github.com"
          git add packages/canvas/src/psychogeographic/PsychogeographicMap.tsx
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "1"
          git commit -m "fix(places): type empty archetype expression fallback"
          git push origin HEAD:feat/redemption-map

      - name: Run focused Places unit acceptance
        run: >-
          pnpm vitest run
          packages/canvas/src/psychogeographic/PsychogeographicMap.test.tsx
          apps/desktop/src/features/psychogeographic/PsychogeographicLens.test.tsx

      - name: Run Places and Timeline browser acceptance
        run: >-
          pnpm playwright test
          tests/e2e/places-globe.spec.ts
          tests/e2e/timeline.spec.ts
          --project=chromium

      - name: Upload Playwright evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: redemption-t12-playwright-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
