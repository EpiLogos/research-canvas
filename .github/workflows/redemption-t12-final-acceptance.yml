name: Redemption T12 final acceptance

on:
  pull_request:
    paths:
      - ".github/workflows/redemption-t12-final-acceptance.yml"
      - "packages/schema/src/place.ts"
      - "packages/schema/src/geography.ts"
      - "packages/domain/src/ports/placesRepository.ts"
      - "packages/domain/src/index.ts"
      - "packages/canvas/src/psychogeographic/**"
      - "apps/desktop/src/features/psychogeographic/**"
      - "apps/desktop/src-tauri/src/commands/places.rs"
      - "apps/desktop/src-tauri/src/db/repositories/graph_metadata.rs"
      - "apps/desktop/src-tauri/src/bin/terminal_bridge.rs"
      - "apps/desktop/src-tauri/src/lib.rs"
      - "tests/e2e/places-globe.spec.ts"
      - "tests/e2e/timeline.spec.ts"
      - "playwright.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

concurrency:
  group: redemption-t12-final-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install canonical Linux bridge build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Check T12 Rust formatting
        run: rustfmt --edition 2021 --check apps/desktop/src-tauri/src/commands/places.rs

      - name: Check and prebuild canonical browser bridge
        run: |
          cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --bin terminal_bridge
          cargo build --manifest-path apps/desktop/src-tauri/Cargo.toml --bin terminal_bridge

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Typecheck workspace
        run: pnpm exec tsc -b

      - name: Run focused Places unit acceptance
        run: >-
          pnpm vitest run
          packages/canvas/src/psychogeographic/PsychogeographicMap.test.tsx
          apps/desktop/src/features/psychogeographic/PsychogeographicLens.test.tsx
          --reporter=verbose

      - name: Run Places and Timeline browser acceptance
        run: >-
          pnpm playwright test
          tests/e2e/places-globe.spec.ts
          tests/e2e/timeline.spec.ts
          --project=chromium

      - name: Verify checkout remained read-only
        run: git diff --exit-code

      - name: Upload Playwright evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: redemption-t12-playwright-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
