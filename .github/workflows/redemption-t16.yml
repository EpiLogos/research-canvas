name: Redemption T16 cross-surface validation

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: redemption-t16-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Apply bounded Places tab-state restoration
        run: python scripts/t17-places-state-carrier.py

      - name: Commit bounded Places restoration
        shell: bash
        run: |
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add \
              packages/canvas/src/psychogeographic/PsychogeographicMap.tsx \
              apps/desktop/src/features/psychogeographic/PsychogeographicLens.tsx \
              apps/desktop/src/layout/Stage.tsx
            git commit -m "feat(places): persist map tab state"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
