name: Redemption T16 cross-surface validation

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: redemption-t16-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Apply bounded Places tab-state restoration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              if old in text:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"{path}: expected one target, found {count}")
                  target.write_text(text.replace(old, new))
                  return
              if new in text:
                  return
              raise SystemExit(f"{path}: asserted pre/post forms not found")

          map_path = "packages/canvas/src/psychogeographic/PsychogeographicMap.tsx"
          replace_once(
              map_path,
              '''  renderer?: MapSurfaceRenderer;
            onOpenCanvasNode?: (graphNodeId: string) => void | Promise<void>;
          }''',
              '''  renderer?: MapSurfaceRenderer;
            initialViewState?: MapViewState;
            initialSelectedGraphNodeId?: string | null;
            onViewStateChange?: (viewState: MapViewState) => void;
            onSelectedGraphNodeIdChange?: (graphNodeId: string | null) => void;
            onOpenCanvasNode?: (graphNodeId: string) => void | Promise<void>;
          }''',
          )
          replace_once(
              map_path,
              '''  renderer: rendererProp,
            onOpenCanvasNode,
          }: PsychogeographicMapProps): JSX.Element {''',
              '''  renderer: rendererProp,
            initialViewState,
            initialSelectedGraphNodeId = null,
            onViewStateChange,
            onSelectedGraphNodeIdChange,
            onOpenCanvasNode,
          }: PsychogeographicMapProps): JSX.Element {''',
          )
          replace_once(
              map_path,
              '''  const laneClickRef = useRef<(laneId: string) => void>(() => {});

            const [renderer, setRenderer]''',
              '''  const laneClickRef = useRef<(laneId: string) => void>(() => {});
            const initialViewStateRef = useRef<MapViewState | undefined>(initialViewState);
            const onViewStateChangeRef = useRef(onViewStateChange);
            const onSelectedGraphNodeIdChangeRef = useRef(onSelectedGraphNodeIdChange);
            onViewStateChangeRef.current = onViewStateChange;
            onSelectedGraphNodeIdChangeRef.current = onSelectedGraphNodeIdChange;

            const [renderer, setRenderer]''',
          )
          replace_once(
              map_path,
              '''  const [viewState, setViewState] = useState<MapViewState>({ latitude: 20, longitude: 0, zoom: 1 });''',
              '''  const [viewState, setViewState] = useState<MapViewState>(() =>
              initialViewState ?? { latitude: 20, longitude: 0, zoom: 1 },
            );''',
          )
          replace_once(
              map_path,
              '''  const [selectedNodeId, setSelectedNodeId] = useState<string | null>(null);''',
              '''  const [selectedNodeId, setSelectedNodeId] = useState<string | null>(initialSelectedGraphNodeId);''',
          )
          replace_once(
              map_path,
              '''  const selectedExpressions = selectedNode
              ? expressionsByPlace.get(selectedNode.graphNodeId) ?? []
              : [];

            const laneYearRange''',
              '''  const selectedExpressions = selectedNode
              ? expressionsByPlace.get(selectedNode.graphNodeId) ?? []
              : [];

            useEffect(() => {
              if (!selectedNodeId || !nodes.some((node) => node.graphNodeId === selectedNodeId)) {
                setRelatedNodes([]);
                setContextLoading(false);
                return;
              }
              let cancelled = false;
              setRelatedNodes([]);
              setContextLoading(true);
              void repository.getRelatedNodesForPlace(projectId, selectedNodeId)
                .then((related) => {
                  if (!cancelled) setRelatedNodes(related);
                })
                .catch(() => {
                  if (!cancelled) setRelatedNodes([]);
                })
                .finally(() => {
                  if (!cancelled) setContextLoading(false);
                });
              return () => {
                cancelled = true;
              };
            }, [nodes, projectId, repository, selectedNodeId]);

            const laneYearRange''',
          )
          replace_once(
              map_path,
              '''  const selectPlace = useCallback((graphNodeId: string) => {
              const node = nodes.find((candidate) => candidate.graphNodeId === graphNodeId);
              if (!node) return;
              setSelectedNodeId(graphNodeId);
              setRelatedNodes([]);
              setContextLoading(true);
              const point = pointForPlace(node);
              if (point) void mountedRenderer.current?.flyTo?.(point.latitude, point.longitude, Math.max(3, viewState.zoom));
              void repository.getRelatedNodesForPlace(projectId, graphNodeId)
                .then(setRelatedNodes)
                .catch(() => setRelatedNodes([]))
                .finally(() => setContextLoading(false));
            }, [nodes, projectId, repository, viewState.zoom]);''',
              '''  const selectPlace = useCallback((graphNodeId: string) => {
              const node = nodes.find((candidate) => candidate.graphNodeId === graphNodeId);
              if (!node) return;
              setSelectedNodeId(graphNodeId);
              onSelectedGraphNodeIdChangeRef.current?.(graphNodeId);
              const point = pointForPlace(node);
              if (point) void mountedRenderer.current?.flyTo?.(point.latitude, point.longitude, Math.max(3, viewState.zoom));
            }, [nodes, viewState.zoom]);''',
          )
          replace_once(
              map_path,
              '''        renderer.setLaneClickHandler?.((laneId) => laneClickRef.current(laneId));
                  renderer.onViewChange?.(setViewState);
                  return Promise.all([''',
              '''        renderer.setLaneClickHandler?.((laneId) => laneClickRef.current(laneId));
                  renderer.onViewChange?.((nextViewState) => {
                    setViewState(nextViewState);
                    onViewStateChangeRef.current?.(nextViewState);
                  });
                  const restoredViewState = initialViewStateRef.current;
                  if (restoredViewState) {
                    void renderer.flyTo?.(
                      restoredViewState.latitude,
                      restoredViewState.longitude,
                      restoredViewState.zoom,
                    );
                  }
                  return Promise.all([''',
          )

          lens_path = "apps/desktop/src/features/psychogeographic/PsychogeographicLens.tsx"
          replace_once(
              lens_path,
              '''  renderer?: MapSurfaceRenderer;
            resolveAsset?: (artifactPath: string) => string;''',
              '''  renderer?: MapSurfaceRenderer;
            initialViewState?: { latitude: number; longitude: number; zoom: number };
            initialSelectedGraphNodeId?: string | null;
            onViewStateChange?: (viewState: { latitude: number; longitude: number; zoom: number }) => void;
            onSelectedGraphNodeIdChange?: (graphNodeId: string | null) => void;
            resolveAsset?: (artifactPath: string) => string;''',
          )
          replace_once(
              lens_path,
              '''  renderer,
            resolveAsset,
            onOpenCanvasNode,''',
              '''  renderer,
            initialViewState,
            initialSelectedGraphNodeId,
            onViewStateChange,
            onSelectedGraphNodeIdChange,
            resolveAsset,
            onOpenCanvasNode,''',
          )
          replace_once(
              lens_path,
              '''        renderer={renderer}
                  onOpenCanvasNode={onOpenCanvasNode}
                />''',
              '''        renderer={renderer}
                  initialViewState={initialViewState}
                  initialSelectedGraphNodeId={initialSelectedGraphNodeId}
                  onViewStateChange={onViewStateChange}
                  onSelectedGraphNodeIdChange={onSelectedGraphNodeIdChange}
                  onOpenCanvasNode={onOpenCanvasNode}
                />''',
          )

          stage_path = "apps/desktop/src/layout/Stage.tsx"
          replace_once(
              stage_path,
              '''  const commonStageSurfaceStyle: React.CSSProperties = { position: "absolute", inset: 0 };

            const openPlaceOnCanvas''',
              '''  const commonStageSurfaceStyle: React.CSSProperties = { position: "absolute", inset: 0 };
            const placesTabState = workspace.activeTab?.state.surfaceId === "places"
              ? workspace.activeTab.state
              : null;

            const openPlaceOnCanvas''',
          )
          replace_once(
              stage_path,
              '''            repoRoot={repoRoot ?? ""}
                        onOpenCanvasNode={openPlaceOnCanvas}
                      />''',
              '''            repoRoot={repoRoot ?? ""}
                        initialViewState={placesTabState ? {
                          longitude: placesTabState.viewport.x,
                          latitude: placesTabState.viewport.y,
                          zoom: placesTabState.viewport.zoom,
                        } : undefined}
                        initialSelectedGraphNodeId={placesTabState?.selectedGraphNodeId ?? null}
                        onViewStateChange={(nextViewState) => {
                          if (!placesTabState) return;
                          workspace.updateTabState({
                            ...placesTabState,
                            viewport: {
                              x: nextViewState.longitude,
                              y: nextViewState.latitude,
                              zoom: nextViewState.zoom,
                            },
                          });
                        }}
                        onSelectedGraphNodeIdChange={(graphNodeId) => {
                          if (!placesTabState) return;
                          workspace.updateTabState({
                            ...placesTabState,
                            selectedGraphNodeId: graphNodeId,
                          });
                        }}
                        onOpenCanvasNode={openPlaceOnCanvas}
                      />''',
          )
          PY
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add \
              packages/canvas/src/psychogeographic/PsychogeographicMap.tsx \
              apps/desktop/src/features/psychogeographic/PsychogeographicLens.tsx \
              apps/desktop/src/layout/Stage.tsx
            git commit -m "feat(places): persist map tab state"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Stop after bounded wiring
        run: echo "Places patch carrier only; read-only T16 is restored on the resulting head."
