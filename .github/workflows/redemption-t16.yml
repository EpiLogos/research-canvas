name: Redemption T16 cross-surface validation

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: redemption-t16-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install canonical Linux bridge build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Audit repository-owned surface data paths
        run: pnpm run audit:hardcoded

      - name: Typecheck workspace
        run: pnpm exec tsc -b

      - name: Run workspace unit acceptance
        run: pnpm vitest run

      - name: Run Rust acceptance serially
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml -- --test-threads=1

      - name: Build desktop and public viewer workspace
        run: pnpm run build

      - name: Prebuild canonical browser bridge
        run: cargo build --manifest-path apps/desktop/src-tauri/Cargo.toml --bin terminal_bridge

      - name: Run six-surface real-data smoke in Chromium
        run: >-
          pnpm playwright test
          tests/e2e/smoke.spec.ts
          --project=chromium
          --workers=1

      - name: Verify checkout remained read-only
        run: git diff --exit-code

      - name: Upload Playwright evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: redemption-t16-playwright-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
