name: Redemption T16 cross-surface validation

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: redemption-t16-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Apply bounded Rust vocabulary repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/desktop/src-tauri/src/db/repositories/graph.rs")
          text = path.read_text()
          old = '    Place => "Place", Work => "Work", Archetype => "Archetype", Dynamic => "Dynamic",'
          new = '    Place => "Place", Work => "Work", Archetype => "Archetype", ArchetypeExpression => "ArchetypeExpression", Dynamic => "Dynamic",'
          if old in text:
              if text.count(old) != 1:
                  raise SystemExit(f"expected one Rust vocabulary repair target, found {text.count(old)}")
              path.write_text(text.replace(old, new))
          elif new not in text:
              raise SystemExit("Rust vocabulary no longer matches the asserted pre- or post-repair form")
          PY
          if ! git diff --quiet -- apps/desktop/src-tauri/src/db/repositories/graph.rs; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add apps/desktop/src-tauri/src/db/repositories/graph.rs
            git commit -m "fix(schema): align Rust entity vocabulary"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install canonical Linux bridge build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Audit repository-owned surface data paths
        run: pnpm run audit:hardcoded

      - name: Typecheck workspace
        run: pnpm exec tsc -b

      - name: Run workspace unit acceptance
        run: pnpm vitest run

      - name: Run local Rust acceptance serially
        id: rust_acceptance
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          manifest="apps/desktop/src-tauri/Cargo.toml"
          test_dir="apps/desktop/src-tauri/tests"
          cargo_args=(test --locked --manifest-path "$manifest" --lib --bins)
          {
            echo "Local Rust acceptance excludes targets owned by pnpm test:graph:integration:"
            while IFS= read -r test_file; do
              target="$(basename "$test_file" .rs)"
              if grep -qF 'support::neo4j_test_graph()' "$test_file"; then
                echo "  graph integration: $target"
                continue
              fi
              cargo_args+=(--test "$target")
            done < <(find "$test_dir" -maxdepth 1 -type f -name '*.rs' | sort)
            echo
            echo "Running local Rust lib/bin and non-graph integration targets"
            cargo "${cargo_args[@]}" -- --test-threads=1
          } > rust-test.log 2>&1

      - name: Upload Rust evidence on failure
        if: steps.rust_acceptance.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: redemption-t16-rust-${{ github.run_id }}
          path: rust-test.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail when Rust acceptance failed
        if: steps.rust_acceptance.outcome == 'failure'
        run: |
          cat rust-test.log
          exit 1

      - name: Build desktop and public viewer workspace
        run: pnpm run build

      - name: Prebuild canonical browser bridge
        run: cargo build --manifest-path apps/desktop/src-tauri/Cargo.toml --bin terminal_bridge

      - name: Run six-surface real-data smoke in Chromium
        run: >-
          pnpm playwright test
          tests/e2e/smoke.spec.ts
          --project=chromium
          --workers=1

      - name: Verify checkout remained read-only
        run: git diff --exit-code

      - name: Upload Playwright evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: redemption-t16-playwright-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
