name: Redemption T12 rustfmt once

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: redemption-t12-rustfmt-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: feat/redemption-map

      - name: Apply rustfmt
        id: format
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          if (( ${#changed[@]} == 0 )); then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for path in "${changed[@]}"; do
            case "$path" in
              apps/desktop/src-tauri/src/commands/places.rs|apps/desktop/src-tauri/src/lib.rs|apps/desktop/src-tauri/src/bin/terminal_bridge.rs) ;;
              *) echo "unexpected rustfmt change: $path" >&2; exit 1 ;;
            esac
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit bounded formatting
        if: steps.format.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "research-canvas-redemption-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            apps/desktop/src-tauri/src/commands/places.rs \
            apps/desktop/src-tauri/src/lib.rs \
            apps/desktop/src-tauri/src/bin/terminal_bridge.rs
          git commit -m "style(places): apply rustfmt"
          git push origin HEAD:feat/redemption-map
