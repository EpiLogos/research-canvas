name: Redemption T11 verification

on:
  push:
    branches:
      - feat/redemption-map
    paths:
      - ".github/workflows/redemption-t11.yml"
      - "apps/desktop/src/features/timeline/**"
      - "apps/desktop/src/layout/Stage.tsx"
      - "packages/canvas/src/timeline/**"
      - "packages/canvas/src/index.ts"
      - "packages/desktop-api/src/repositories.ts"
      - "packages/desktop-api/src/repositories.timeline.test.ts"
      - "packages/domain/src/ports/timelineRepository.ts"
      - "packages/domain/src/index.ts"
      - "tests/e2e/timeline.spec.ts"
  pull_request:
    paths:
      - ".github/workflows/redemption-t11.yml"
      - "apps/desktop/src/features/timeline/**"
      - "apps/desktop/src/layout/Stage.tsx"
      - "packages/canvas/src/timeline/**"
      - "packages/canvas/src/index.ts"
      - "packages/desktop-api/src/repositories.ts"
      - "packages/desktop-api/src/repositories.timeline.test.ts"
      - "packages/domain/src/ports/timelineRepository.ts"
      - "packages/domain/src/index.ts"
      - "tests/e2e/timeline.spec.ts"
  workflow_dispatch:

jobs:
  t11:
    name: typecheck + timeline contract + e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.25.0 --activate

      - name: Install workspace for verification
        # The long-lived redemption branch currently has pre-existing lockfile
        # importer drift (`packages/canvas` declares viewers but its importer
        # omits it). T11 must still execute mechanically; lock repair is kept
        # separate from this surface ticket instead of silently blocking it.
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck workspace
        run: pnpm exec tsc -b

      - name: Run T11 unit and repository contract tests
        run: >-
          pnpm vitest run
          packages/canvas/src/timeline/TimelineSurface.test.tsx
          apps/desktop/src/features/timeline/TimelineLens.test.tsx
          packages/desktop-api/src/repositories.timeline.test.ts

      - name: Prebuild browser bridge
        # apps/desktop/scripts/dev.mjs starts Vite and the Rust bridge together.
        # On a fresh runner Vite is ready long before Cargo's first build, so
        # Playwright can race the workspace bootstrap and test a loading shell
        # instead of Surface #2. Prebuilding makes the dev bridge startup
        # deterministic without changing the product path under test.
        run: cargo build --manifest-path apps/desktop/src-tauri/Cargo.toml --bin terminal_bridge

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run T11 browser acceptance
        env:
          PLAYWRIGHT_HTML_OPEN: never
        shell: bash
        run: |
          set -o pipefail
          pnpm playwright test tests/e2e/timeline.spec.ts --trace=on --reporter=line,html 2>&1 | tee playwright-output.txt

      - name: Annotate browser failure
        if: failure()
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("playwright-output.txt").read_text(errors="replace") if Path("playwright-output.txt").exists() else "Playwright failed without captured output."
          tail = "\n".join(text.splitlines()[-100:])[-12000:]
          escaped = tail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error file=tests/e2e/timeline.spec.ts,title=T11 Playwright failure::{escaped}")
          PY

      - name: Retain browser verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redemption-t11-playwright
          path: |
            playwright-output.txt
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 7
