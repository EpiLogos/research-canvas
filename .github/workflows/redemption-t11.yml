name: Redemption T11 lockfile repair

on:
  pull_request:
    paths:
      - ".github/workflows/redemption-t11.yml"

permissions:
  contents: write

concurrency:
  group: redemption-t11-lockfile-repair-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: feat/redemption-map

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate lockfile metadata only
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Prove the repair is bounded
        shell: bash
        run: |
          set -euo pipefail
          status="$(git status --short)"
          test "$status" = " M pnpm-lock.yaml"
          stats="$(git diff --numstat -- pnpm-lock.yaml)"
          test "$stats" = $'3\t0\tpnpm-lock.yaml'
          git diff -- pnpm-lock.yaml | grep -F "+      '@research-canvas/viewers':"
          git diff -- pnpm-lock.yaml | grep -F "+        specifier: workspace:*"
          git diff -- pnpm-lock.yaml | grep -F "+        version: link:../viewers"

      - name: Commit repaired lockfile
        shell: bash
        run: |
          git config user.name "research-canvas-redemption-bot"
          git config user.email "actions@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "fix(workspace): sync canvas viewers lockfile entry"
          git push origin HEAD:feat/redemption-map
