name: Redemption T11 verification

on:
  pull_request:
    paths:
      - ".github/workflows/redemption-t11.yml"
      - "apps/desktop/src/features/canvas/CanvasWorkspaceContext.tsx"
      - "apps/desktop/src/features/canvas/CanvasWorkspaceContext.test.tsx"
      - "apps/desktop/src/features/timeline/**"
      - "apps/desktop/src/layout/Shell.tsx"
      - "apps/desktop/src/layout/Stage.tsx"
      - "packages/canvas/src/timeline/**"
      - "packages/canvas/src/index.ts"
      - "packages/desktop-api/src/repositories.ts"
      - "packages/desktop-api/src/repositories.timeline.test.ts"
      - "packages/domain/src/ports/timelineRepository.ts"
      - "packages/domain/src/index.ts"
      - "tests/e2e/timeline.spec.ts"
  workflow_dispatch:

concurrency:
  group: redemption-t11-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  t11:
    name: typecheck + timeline contract + e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Apply local-first repository fix once
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/redemption-map'
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          python - <<'PY'
          from pathlib import Path

          repo_path = Path("packages/desktop-api/src/repositories.ts")
          source = repo_path.read_text()
          if "falling back to readGraphNode here silently reintroduced a Neo4j" not in source:
            start = source.index("      let graph = canvasNode.graph ?? null;")
            final = '      if (!graph || (graph.isArchetype !== true && graph.entityType !== "Archetype")) continue;'
            end = source.index(final, start) + len(final)
            replacement = (
              "      // The canonical walk must remain local-first. The timeline view already\n"
              "      // contains the graph records needed for earthbound/archetype projection;\n"
              "      // falling back to readGraphNode here silently reintroduced a Neo4j\n"
              "      // dependency and delayed the entire walk behind one remote read per\n"
              "      // Canvas node. Explicit reader/open-node behaviour may still use\n"
              "      // loadNode after the walk has rendered.\n"
              "      const graph = canvasNode.graph ?? nodesById.get(graphNodeId) ?? null;\n"
              "      if (!graph || (graph.isArchetype !== true && graph.entityType !== \"Archetype\")) continue;"
            )
            repo_path.write_text(source[:start] + replacement + source[end:])

          test_path = Path("packages/desktop-api/src/repositories.timeline.test.ts")
          tests = test_path.read_text()
          tests = tests.replace(
            '{ id: event.graphNodeId, graphNodeId: event.graphNodeId, graph: event },\n          { id: place.graphNodeId, graphNodeId: place.graphNodeId, graph: place },',
            '{ id: event.graphNodeId, graphNodeId: event.graphNodeId },\n          { id: place.graphNodeId, graphNodeId: place.graphNodeId },',
            1,
          )
          assertion = '    expect(transport.readGraphNode).not.toHaveBeenCalled();\n'
          if assertion not in tests:
            marker = '    expect(walk.archetypeLayers).toEqual([\n'
            if marker not in tests:
              raise SystemExit("expected timeline repository assertion marker not found")
            tests = tests.replace(marker, assertion + marker, 1)
          test_path.write_text(tests)
          PY

          if git diff --quiet; then
            echo "Local-first Timeline repository fix already present"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/desktop-api/src/repositories.ts packages/desktop-api/src/repositories.timeline.test.ts
          git commit -m "fix(t11): keep canonical timeline walk local-first"
          git push origin "HEAD:${HEAD_REF}"

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.25.0 --activate

      - name: Install workspace for verification
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck workspace
        run: pnpm exec tsc -b

      - name: Run T11 unit and repository contract tests
        run: >-
          pnpm vitest run
          apps/desktop/src/features/canvas/CanvasWorkspaceContext.test.tsx
          packages/canvas/src/timeline/TimelineSurface.test.tsx
          apps/desktop/src/features/timeline/TimelineLens.test.tsx
          packages/desktop-api/src/repositories.timeline.test.ts

      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Prebuild browser bridge
        shell: bash
        run: |
          set -o pipefail
          cargo build --manifest-path apps/desktop/src-tauri/Cargo.toml --bin terminal_bridge 2>&1 | tee bridge-build-output.txt

      - name: Annotate bridge prebuild failure
        if: failure() && hashFiles('bridge-build-output.txt') != ''
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("bridge-build-output.txt").read_text(errors="replace")
          tail = "\n".join(text.splitlines()[-100:])[-12000:]
          escaped = tail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error file=apps/desktop/src-tauri/Cargo.toml,title=T11 bridge prebuild failure::{escaped}")
          PY

      - name: Install Chromium
        if: success()
        run: pnpm exec playwright install --with-deps chromium

      - name: Run T11 browser acceptance
        if: success()
        env:
          PLAYWRIGHT_HTML_OPEN: never
        shell: bash
        run: |
          set -o pipefail
          pnpm playwright test tests/e2e/timeline.spec.ts --trace=on --reporter=line,html 2>&1 | tee playwright-output.txt

      - name: Annotate browser failure
        if: failure() && hashFiles('playwright-output.txt') != ''
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("playwright-output.txt").read_text(errors="replace")
          tail = "\n".join(text.splitlines()[-100:])[-12000:]
          escaped = tail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error file=tests/e2e/timeline.spec.ts,title=T11 Playwright failure::{escaped}")
          PY

      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redemption-t11-verification
          path: |
            bridge-build-output.txt
            playwright-output.txt
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 7
