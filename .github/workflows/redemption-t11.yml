name: Redemption T11 acceptance

on:
  pull_request:
    paths:
      - ".github/workflows/redemption-t11.yml"
      - "packages/canvas/src/timeline/**"
      - "packages/domain/src/**timeline**"
      - "apps/desktop/src/**timeline**"
      - "apps/desktop/src/layout/observatory.css"
      - "apps/desktop/scripts/dev.mjs"
      - "apps/desktop/src-tauri/**"
      - "tests/e2e/timeline.spec.ts"
      - "playwright.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: write

concurrency:
  group: redemption-t11-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: feat/redemption-map
          fetch-depth: 2

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Apply bounded T12 Places substrate when absent
        id: t12
        shell: bash
        run: |
          set -euo pipefail
          if test -f apps/desktop/src-tauri/src/commands/places.rs; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "T12 Places substrate already present."
            exit 0
          fi

          PATCH_SOURCE_SHA=da7a4ab18aa77ac3e70eee8ffd6c81b5d04d664e
          git fetch --depth=1 origin "$PATCH_SOURCE_SHA"
          git show "$PATCH_SOURCE_SHA":.github/workflows/redemption-t12-substrate.yml > /tmp/redemption-t12-source.yml

          python <<'PY'
          from pathlib import Path

          workflow = Path('/tmp/redemption-t12-source.yml').read_text()
          start_marker = '      - name: Apply bounded Places repository substrate\n'
          end_marker = '\n      - name: Format Rust substrate\n'
          start = workflow.index(start_marker)
          run_start = workflow.index('        run: |\n', start) + len('        run: |\n')
          end = workflow.index(end_marker, run_start)
          block = workflow[run_start:end]
          lines = block.splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/apply-t12-substrate.sh').write_text(script)
          PY

          bash /tmp/apply-t12-substrate.sh

          python <<'PY'
          from pathlib import Path

          target = Path('apps/desktop/src/features/psychogeographic/DesktopPlacesRepository.ts')
          text = target.read_text()
          old = '''              || value === "exact"
              || value === "range"
              || value === "circa"
'''
          new = '''              || value === "month"
              || value === "day"
'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one generated precision alternative block, found {text.count(old)}')
          target.write_text(text.replace(old, new, 1))
          PY

          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install canonical Linux bridge build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Validate T12 substrate before publish
        if: steps.t12.outputs.changed == 'true'
        run: |
          pnpm exec tsc -b
          cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --bin terminal_bridge

      - name: Commit bounded T12 substrate
        if: steps.t12.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "research-canvas-redemption-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            apps/desktop/src-tauri/src/db/repositories/graph_metadata.rs \
            apps/desktop/src-tauri/src/commands/places.rs \
            apps/desktop/src-tauri/src/lib.rs \
            apps/desktop/src-tauri/src/bin/terminal_bridge.rs \
            packages/domain/src/ports/placesRepository.ts \
            packages/domain/src/index.ts \
            apps/desktop/src/features/psychogeographic/DesktopPlacesRepository.ts
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "7"
          git commit -m "feat(places): add project-wide repository substrate"
          git push origin HEAD:feat/redemption-map

      - name: Prebuild canonical browser workspace bridge
        run: >-
          cargo build
          --manifest-path apps/desktop/src-tauri/Cargo.toml
          --bin terminal_bridge

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Typecheck workspace
        run: pnpm exec tsc -b

      - name: Run focused Timeline unit acceptance
        run: >-
          pnpm vitest run
          packages/canvas/src/timeline/TimelineSurface.test.tsx
          packages/canvas/src/timeline/TimelineLens.test.tsx

      - name: Run Timeline browser acceptance
        run: pnpm playwright test tests/e2e/timeline.spec.ts --project=chromium

      - name: Upload Playwright evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: redemption-t11-playwright-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
