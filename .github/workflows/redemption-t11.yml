name: Redemption T11 verification

on:
  pull_request:
    paths:
      - ".github/workflows/redemption-t11.yml"
      - "apps/desktop/src/features/timeline/**"
      - "apps/desktop/src/layout/Stage.tsx"
      - "packages/canvas/src/timeline/**"
      - "packages/canvas/src/index.ts"
      - "packages/desktop-api/src/repositories.ts"
      - "packages/desktop-api/src/repositories.timeline.test.ts"
      - "packages/domain/src/ports/timelineRepository.ts"
      - "packages/domain/src/index.ts"
      - "tests/e2e/timeline.spec.ts"
  workflow_dispatch:

concurrency:
  group: redemption-t11-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  t11:
    name: typecheck + timeline contract + e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Apply T11 hydration and repository-composition fixes
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/redemption-map'
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          python - <<'PY'
          from pathlib import Path

          context_path = Path("apps/desktop/src/features/canvas/CanvasWorkspaceContext.tsx")
          context = context_path.read_text()
          section_start = context.index("        const tabId = canvasTabId(document.constellation.id, primaryCanvasId);")
          section_end = context.index("        pendingCanvasTabIdRef.current = null;", section_start)
          section = context[section_start:section_end]
          activation = "          activate: true,"
          ensure = "        ensureCanvasTab({"
          if activation not in section or ensure not in section:
              raise SystemExit("expected Canvas hydration activation section not found")
          guard = (
              "        const managerAtHydration = tabManager.getState();\n"
              "        const activeTabAtHydration =\n"
              "          managerAtHydration.tabs.find((tab) => tab.id === managerAtHydration.activeTabId) ?? null;\n"
              "        // Constellation hydration may complete after the user has already\n"
              "        // moved to another surface. Keep its Canvas tab current without\n"
              "        // stealing focus; activation is reserved for normal Canvas-led\n"
              "        // constellation navigation, first hydration, or an explicit pending\n"
              "        // Canvas-tab activation.\n"
              "        const shouldActivateCanvasTab =\n"
              "          pendingCanvasTabIdRef.current === tabId ||\n"
              "          activeTabAtHydration === null ||\n"
              "          activeTabAtHydration.surfaceId === \"canvas\";\n\n"
          )
          section = section.replace(ensure, guard + ensure, 1)
          section = section.replace(activation, "          activate: shouldActivateCanvasTab,", 1)
          context_path.write_text(context[:section_start] + section + context[section_end:])

          shell_path = Path("apps/desktop/src/layout/Shell.tsx")
          shell = shell_path.read_text()
          old_import = (
              'import {\n'
              '  createWorkspaceServices,\n'
              '  type GraphNode,\n'
              '  type TimelineRelationField,\n'
              '} from "@research-canvas/desktop-api";'
          )
          new_import = (
              'import {\n'
              '  DesktopTimelineRepository,\n'
              '  type GraphNode,\n'
              '  type TimelineRelationField,\n'
              '} from "@research-canvas/desktop-api";'
          )
          old_source = (
              '  const timelineDataSource = useMemo(\n'
              '    () =>\n'
              '      workspace.workspaceId\n'
              '        ? createTimelineDataSource({\n'
              '            transport: createWorkspaceServices(),\n'
              '            workspaceId: workspace.workspaceId,\n'
              '          })\n'
              '        : null,\n'
              '    [workspace.workspaceId],\n'
              '  );'
          )
          new_source = (
              '  const timelineDataSource = useMemo(\n'
              '    () =>\n'
              '      workspace.workspaceId && workspace.databasePath\n'
              '        ? createTimelineDataSource({\n'
              '            repository: new DesktopTimelineRepository(\n'
              '              workspace.transport,\n'
              '              workspace.workspaceId,\n'
              '              workspace.databasePath,\n'
              '            ),\n'
              '          })\n'
              '        : null,\n'
              '    [workspace.databasePath, workspace.transport, workspace.workspaceId],\n'
              '  );'
          )
          if old_import not in shell or old_source not in shell:
              raise SystemExit("expected Shell timeline composition block not found")
          shell = shell.replace(old_import, new_import, 1).replace(old_source, new_source, 1)
          shell_path.write_text(shell)
          PY

          if git diff --quiet; then
            echo "T11 fixes already present"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src/features/canvas/CanvasWorkspaceContext.tsx apps/desktop/src/layout/Shell.tsx
          git commit -m "fix(t11): preserve surface intent through canonical timeline composition"
          git push origin "HEAD:${HEAD_REF}"

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.25.0 --activate

      - name: Install workspace for verification
        # The long-lived redemption branch currently has pre-existing lockfile
        # importer drift (`packages/canvas` declares viewers but its importer
        # omits it). T11 must still execute mechanically; lock repair is kept
        # separate from this surface ticket instead of silently blocking it.
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck workspace
        run: pnpm exec tsc -b

      - name: Run T11 unit and repository contract tests
        run: >-
          pnpm vitest run
          packages/canvas/src/timeline/TimelineSurface.test.tsx
          apps/desktop/src/features/timeline/TimelineLens.test.tsx
          packages/desktop-api/src/repositories.timeline.test.ts

      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Prebuild browser bridge
        # apps/desktop/scripts/dev.mjs starts Vite and the Rust bridge together.
        # On a fresh runner Vite is ready long before Cargo's first build, so
        # Playwright can race the workspace bootstrap and test a loading shell
        # instead of Surface #2. Prebuilding makes the dev bridge startup
        # deterministic without changing the product path under test.
        shell: bash
        run: |
          set -o pipefail
          cargo build --manifest-path apps/desktop/src-tauri/Cargo.toml --bin terminal_bridge 2>&1 | tee bridge-build-output.txt

      - name: Annotate bridge prebuild failure
        if: failure() && hashFiles('bridge-build-output.txt') != ''
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("bridge-build-output.txt").read_text(errors="replace")
          tail = "\n".join(text.splitlines()[-100:])[-12000:]
          escaped = tail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error file=apps/desktop/src-tauri/Cargo.toml,title=T11 bridge prebuild failure::{escaped}")
          PY

      - name: Install Chromium
        if: success()
        run: pnpm exec playwright install --with-deps chromium

      - name: Run T11 browser acceptance
        if: success()
        env:
          PLAYWRIGHT_HTML_OPEN: never
        shell: bash
        run: |
          set -o pipefail
          pnpm playwright test tests/e2e/timeline.spec.ts --trace=on --reporter=line,html 2>&1 | tee playwright-output.txt

      - name: Annotate browser failure
        if: failure() && hashFiles('playwright-output.txt') != ''
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("playwright-output.txt").read_text(errors="replace")
          tail = "\n".join(text.splitlines()[-100:])[-12000:]
          escaped = tail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error file=tests/e2e/timeline.spec.ts,title=T11 Playwright failure::{escaped}")
          PY

      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redemption-t11-verification
          path: |
            bridge-build-output.txt
            playwright-output.txt
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 7
