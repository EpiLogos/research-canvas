name: Redemption T11 acceptance

on:
  pull_request:
    paths:
      - ".github/workflows/redemption-t11.yml"
      - "packages/canvas/src/timeline/**"
      - "packages/domain/src/**timeline**"
      - "apps/desktop/src/**timeline**"
      - "apps/desktop/src/layout/observatory.css"
      - "apps/desktop/scripts/dev.mjs"
      - "tests/e2e/timeline.spec.ts"
      - "playwright.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

concurrency:
  group: redemption-t11-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Typecheck workspace
        run: pnpm exec tsc -b

      - name: Run focused Timeline unit acceptance
        run: >-
          pnpm vitest run
          packages/canvas/src/timeline/TimelineSurface.test.tsx
          packages/canvas/src/timeline/TimelineLens.test.tsx

      - name: Run Timeline browser acceptance
        env:
          RESEARCH_CANVAS_SKIP_TERMINAL_BRIDGE: "1"
        run: pnpm playwright test tests/e2e/timeline.spec.ts --project=chromium

      - name: Upload Playwright evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: redemption-t11-playwright-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
