name: Redemption T17 final integration

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: redemption-t17-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  wire-restoration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Apply bounded T17 restoration wiring
