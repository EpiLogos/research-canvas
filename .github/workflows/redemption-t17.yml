name: Redemption T17 final integration

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: redemption-t17-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install canonical Linux bridge build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Audit repository-owned surface data paths
        run: pnpm run audit:hardcoded

      - name: Typecheck workspace
        run: pnpm exec tsc -b

      - name: Run workspace unit acceptance
        run: pnpm vitest run

      - name: Run local Rust acceptance serially
        id: rust_acceptance
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          manifest="apps/desktop/src-tauri/Cargo.toml"
          test_dir="apps/desktop/src-tauri/tests"
          cargo_args=(test --locked --manifest-path "$manifest" --lib --bins)
          {
            echo "Local Rust acceptance excludes targets owned by pnpm test:graph:integration:"
            while IFS= read -r test_file; do
              target="$(basename "$test_file" .rs)"
              if grep -qF 'support::neo4j_test_graph()' "$test_file"; then
                echo "  graph integration: $target"
                continue
              fi
              cargo_args+=(--test "$target")
            done < <(find "$test_dir" -maxdepth 1 -type f -name '*.rs' | sort)
            cargo "${cargo_args[@]}" -- --test-threads=1
          } > rust-test.log 2>&1

      - name: Upload Rust evidence on failure
        if: steps.rust_acceptance.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: redemption-t17-rust-${{ github.run_id }}
          path: rust-test.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail when Rust acceptance failed
        if: steps.rust_acceptance.outcome == 'failure'
        run: |
          cat rust-test.log
          exit 1

      - name: Build desktop and public viewer workspace
        run: pnpm run build

      - name: Prebuild canonical browser bridge
        run: cargo build --manifest-path apps/desktop/src-tauri/Cargo.toml --bin terminal_bridge

      - name: Run full-flow when landed
        shell: bash
        run: |
          if [[ -f tests/e2e/full-flow.spec.ts ]]; then
            pnpm playwright test tests/e2e/full-flow.spec.ts --project=chromium --workers=1
          else
            echo "full-flow.spec.ts not landed yet; this run is baseline only"
          fi

      - name: Verify checkout remained read-only
        run: git diff --exit-code

      - name: Upload Playwright evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: redemption-t17-playwright-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
