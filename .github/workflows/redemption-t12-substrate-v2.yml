name: Redemption T12 substrate v2

on:
  pull_request:
    paths:
      - ".github/workflows/redemption-t12-substrate-v2.yml"

permissions:
  contents: write

concurrency:
  group: redemption-t12-substrate-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: feat/redemption-map

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Apply corrected bounded Places repository substrate
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          if test -f apps/desktop/src-tauri/src/commands/places.rs; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Places substrate already present; verifier is a no-op."
            exit 0
          fi

          python <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/redemption-t12-substrate.yml').read_text()
          start_marker = '      - name: Apply bounded Places repository substrate\n'
          end_marker = '\n      - name: Format Rust substrate\n'
          start = workflow.index(start_marker)
          run_start = workflow.index('        run: |\n', start) + len('        run: |\n')
          end = workflow.index(end_marker, run_start)
          block = workflow[run_start:end]
          lines = block.splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'

          old = '''            return value === "year"
              || value === "decade"
              || value === "century"
              || value === "millennium"
              || value === "exact"
              || value === "range"
              || value === "circa"
              ? value as TemporalPrecision
              : null;'''
          new = '''            return value === "millennium"
              || value === "century"
              || value === "decade"
              || value === "year"
              || value === "month"
              || value === "day"
              ? value as TemporalPrecision
              : null;'''
          if script.count(old) != 1:
              raise SystemExit(f'expected one temporal precision parser to correct, found {script.count(old)}')
          script = script.replace(old, new, 1)
          Path('/tmp/apply-t12-substrate.sh').write_text(script)
          PY

          bash /tmp/apply-t12-substrate.sh
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Format Rust substrate
        if: steps.apply.outputs.changed == 'true'
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Install workspace dependencies
        if: steps.apply.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install canonical Linux bridge build dependencies
        if: steps.apply.outputs.changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Typecheck TypeScript substrate
        if: steps.apply.outputs.changed == 'true'
        run: pnpm exec tsc -b

      - name: Check native Places substrate
        if: steps.apply.outputs.changed == 'true'
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --bin terminal_bridge

      - name: Commit bounded substrate
        if: steps.apply.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          git config user.name "research-canvas-redemption-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            apps/desktop/src-tauri/src/db/repositories/graph_metadata.rs \
            apps/desktop/src-tauri/src/commands/places.rs \
            apps/desktop/src-tauri/src/lib.rs \
            apps/desktop/src-tauri/src/bin/terminal_bridge.rs \
            packages/domain/src/ports/placesRepository.ts \
            packages/domain/src/index.ts \
            apps/desktop/src/features/psychogeographic/DesktopPlacesRepository.ts
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "7"
          git commit -m "feat(places): add project-wide repository substrate"
          git push origin HEAD:feat/redemption-map
